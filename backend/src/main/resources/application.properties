spring.application.name=DigitalMarketingCampaignService

server.port=8081

# PostgreSQL Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgresdb:5432/campaign-klustudentdb
spring.datasource.username=postgres
spring.datasource.password=docker

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Eureka Configuration (disabled)
# eureka.instance.appname=DigitalMarketingCampaignService
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.instance.hostname=localhost